name: flyrank-capstone-widget-platform
owner: Akash Yadav
track: FlyRank Internship Backend
stack: Python + FastAPI
run: docker compose up --build
seed: python seed.py
test: pytest -q
base_url: http://localhost:8000
endpoints:
  - POST /auth/login
  - POST /widgets
  - GET /widgets
  - GET /widgets/{id}
  - PUT /widgets/{id}
  - DELETE /widgets/{id}
  - GET /widgets/{id}/embed
  - GET /widgets/{id}/config
  - GET /widget.v{version}.js?id={id}
  - OPTIONS /submissions
  - POST /submissions
  - GET /dashboard/submissions
  - GET /dashboard/stats
